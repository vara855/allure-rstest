name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
        rstest: ['0.11.12', 'latest']
    name: node ${{ matrix.node }} / rstest ${{ matrix.rstest }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Pin @rstest/core
        run: npm install --no-save @rstest/core@${{ matrix.rstest }}

      - name: Install Chromium for the browser test
        run: npx playwright install chromium

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Worker-scoped specs
        run: npx rstest run -c tests/rstest.worker.config.ts